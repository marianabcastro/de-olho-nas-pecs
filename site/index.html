<style>
/* Layout: uma coluna de leitura (~46rem), fundo branco e texto preto; a cor só aparece para dizer o que aconteceu (verde aprovou, amarelo em andamento, vermelho parou) */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #111111;
  --muted: #5b5f66;
  --line: #e4e6ea;
  --soft: #f4f5f7;
  --verde: #1b7f3b;     --verde-bg: #e7f5ec;
  --amarelo: #8a6100;   --amarelo-bg: #fff4cf;   --amarelo-forte: #e0a400;
  --vermelho: #c22f2f;  --vermelho-bg: #fdeaea;
  --cinza: #5b5f66;     --cinza-bg: #eef0f2;
  --sim: #1b7f3b; --nao: #c22f2f; --abst: #a7adb5;
  --camara: #1b7f3b; --senado: #2456a6;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.55; margin: 0; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 4rem; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); font-weight: 800; letter-spacing: -0.01em; }
h1.long { font-size: clamp(1.25rem, 3.6vw, 1.55rem); }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--senado); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); }

/* topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 8px 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand svg { width: 38px; height: 26px; flex: none; }
.nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nav a { text-decoration: none; padding: 6px 10px; border-radius: 999px; font-size: 0.95rem; }
/* só a página atual fica destacada */
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.nav a:not([aria-current="page"]):hover { background: var(--soft); }

/* blocos */
.hero { display: grid; gap: 14px; padding-block: 28px 4px; }
.hero p { max-width: 40rem; font-size: 1.12rem; }
section { display: grid; gap: 14px; padding-top: 34px; }
section, .box, .list, .pec-head, .hero, .filters, .vote, .chat, .msg { grid-template-columns: minmax(0, 1fr); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-top: 4px; }
.stats div { display: flex; align-items: baseline; gap: 6px; }
.stats .num { font-size: 1.35rem; }
/* setinha ↗ no canto de cada bloco: leva à fonte oficial de onde veio a informação */
.com-fonte { position: relative; padding-right: 40px; }
.fonte { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 999px; text-decoration: none; color: var(--muted); font-size: 1rem; line-height: 1; }
.fonte:hover, .fonte:focus-visible { background: var(--soft); color: var(--ink); }
.box { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.box.soft { background: var(--soft); border-color: var(--soft); }
.notice { font-size: 0.85rem; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); text-decoration: none; cursor: pointer; justify-self: start; }
.btn.ghost { background: var(--bg); color: var(--ink); }
.btn.small { padding: 6px 12px; font-size: 0.92rem; }

/* status: verde / amarelo / vermelho / cinza */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--c-bg); color: var(--c); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.verde { --c: var(--verde); --c-bg: var(--verde-bg); --c-bar: var(--verde); }
.amarelo { --c: var(--amarelo); --c-bg: var(--amarelo-bg); --c-bar: var(--amarelo-forte); }
.vermelho { --c: var(--vermelho); --c-bg: var(--vermelho-bg); --c-bar: var(--vermelho); }
.cinza { --c: var(--cinza); --c-bg: var(--cinza-bg); --c-bar: #b9bec5; }
.principio { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; border: 1.5px dashed var(--ink); color: var(--ink); }
.resumo-grupo { margin: 10px 0 0; font-style: italic; color: var(--muted); }
.resumo-lista { margin: 4px 0 0; padding-left: 1.2em; } .resumo-lista li { margin: 0 0 6px; }
.principio-nota, .nota-pec { font-size: 0.92rem; padding: 10px 14px; border: 1.5px dashed var(--line); border-radius: 10px; }
.apelido { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 2px 9px; border-radius: 6px; background: var(--ink); color: var(--bg); }

/* filtros */
.filters { display: grid; gap: 10px; }
.search, .finder input, .chat-form input { width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
select { font: inherit; font-size: 0.95rem; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); max-width: 100%; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { font: inherit; font-size: 0.92rem; white-space: nowrap; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* cartões */
.list { display: grid; gap: 10px; }
.card { display: grid; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-left: 5px solid var(--c-bar, var(--line)); border-radius: var(--r); padding: 14px 16px; text-decoration: none; min-width: 0; }
.card:hover { border-color: #c9cdd3; border-left-color: var(--c-bar); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.card .title { font-weight: 700; font-size: 1.05rem; line-height: 1.35; }
.card .sub { color: var(--muted); font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 0.88rem; color: var(--muted); }
.casa { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink); }
.casa::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--hc, var(--muted)); }
.casa.camara { --hc: var(--camara); } .casa.senado { --hc: var(--senado); }
.dots { display: flex; gap: 3px; align-items: center; }
.dots i { width: 20px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--ink); }
.dots i.now { background: var(--c-bar, var(--ink)); }
.more { font: inherit; justify-self: center; padding: 10px 20px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--bg); color: var(--ink); cursor: pointer; font-weight: 700; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); }
.feat { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.mini-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--soft); }
.mini-bar span, .bar span, .pbar span { display: block; height: 100%; }

.teaser { display: grid; gap: 12px; padding: 18px; border-radius: var(--r); background: var(--soft); }
.teaser h2 { font-size: 1.2rem; }

/* página da PEC */
.back { display: inline-block; padding-top: 18px; font-size: 0.95rem; }
.pec-head { display: grid; gap: 12px; padding-top: 14px; }
.tres { display: grid; gap: 12px; }
.tres div { display: grid; gap: 2px; }
.tres .resumo-lista b { font-size: inherit; text-transform: none; letter-spacing: normal; color: var(--ink); }
.tres > div > b { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.oficial { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); font-size: 0.95rem; display: grid; gap: 2px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person { font-size: 0.92rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; }
.person:hover { border-color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.opina { display: grid; gap: 10px; padding: 16px; border-radius: var(--r); background: var(--amarelo-bg); }

.path { list-style: none; margin: 0; padding: 0; display: grid; }
.path li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.path li:last-child { padding-bottom: 0; }
.path li::before { content: ""; position: absolute; left: 13px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.path li:last-child::before { display: none; }
.path li.done::before { background: var(--verde); }
.path .mark { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; font-family: var(--f-data); font-size: 0.8rem; color: var(--muted); z-index: 1; }
.path li.done .mark { background: var(--verde); border-color: var(--verde); color: #fff; }
.path li.now .mark { border-color: var(--amarelo-forte); background: var(--amarelo-bg); color: var(--amarelo); border-width: 3px; }
.path li.stop .mark { border-color: var(--vermelho); background: var(--vermelho-bg); color: var(--vermelho); }
.path .step b { display: block; }
.path li.now .step b { color: var(--amarelo); }
.path li.stop .step b { color: var(--vermelho); }

.vote { display: grid; gap: 12px; }
.score { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.score .num { font-size: 1.5rem; }
.k-sim { color: var(--sim); } .k-nao { color: var(--nao); } .k-abst { color: var(--muted); }
.bar { position: relative; height: 18px; border-radius: 5px; background: var(--soft); display: flex; }
.bar span:first-child { border-radius: 5px 0 0 5px; }
.bar .q { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2.5px solid var(--ink); }
.q-label { position: relative; height: 1.4em; font-size: 0.82rem; font-weight: 700; }
.q-label span { position: absolute; white-space: nowrap; transform: translateX(-50%); }
details { border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
summary { cursor: pointer; font-weight: 700; }
.tbl-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td.n, th.n { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.pbar { display: flex; height: 8px; width: 90px; border-radius: 3px; overflow: hidden; background: var(--soft); }
.finder { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.finder input { flex: 1 1 12rem; min-width: 0; padding: 8px 10px; border-radius: 8px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.timeline li { display: grid; gap: 2px; padding-left: 14px; border-left: 2px solid var(--line); min-width: 0; overflow-wrap: anywhere; }

/* chat */
.chat { display: grid; gap: 14px; padding-top: 18px; }
.msg { display: grid; gap: 10px; max-width: 100%; min-width: 0; }
.msg.bot { padding: 14px 16px; border-radius: 4px var(--r) var(--r) var(--r); background: var(--soft); }
.msg.user { justify-self: end; max-width: 85%; padding: 10px 14px; border-radius: var(--r) 4px var(--r) var(--r); background: var(--ink); color: var(--bg); }
.chat-form { position: sticky; bottom: env(safe-area-inset-bottom, 0px); display: flex; gap: 8px; padding-block: 12px; background: var(--bg); border-top: 1px solid var(--line); margin-top: 14px; }
.chat-form input { flex: 1; min-width: 0; }
.stat-list { display: grid; gap: 6px; }
.stat { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; font: inherit; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.stat:hover:not([disabled]) { border-color: var(--ink); }
.stat[disabled] { cursor: default; color: var(--muted); }
.stat b.num { font-size: 1.15rem; }
.stat-detail { display: grid; gap: 8px; padding: 6px 4px 8px; font-size: 0.95rem; }

/* como funciona */
.gloss { display: grid; gap: 12px; margin: 0; }
.gloss dt { font-weight: 700; }
.gloss dd { margin: 2px 0 0; color: var(--muted); }
.flow { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); }
.flow .box b.num { font-size: 1.6rem; }
.audio { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r); background: var(--soft); flex-wrap: wrap; margin-top: 18px; }
.audio svg { width: 28px; height: 28px; flex: none; }
.audio audio { width: 100%; }

footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.88rem; color: var(--muted); display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .card, .chip, .stat { transition: border-color .15s, box-shadow .15s; } }

/* seletor de idioma */
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px; }
.lang button { font: inherit; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em; border: 0; background: transparent; color: var(--muted); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 640px) {
  .top .lang { order: 1; } .top .nav { order: 2; }
  /* no celular o menu ocupa duas linhas: fixo no topo, tomaria ~1/6 da tela; aqui ele rola junto com a página */
  .top { position: static; }
  .lang button { min-height: 36px; min-width: 40px; padding: 4px 10px; }   /* alvo de toque maior */
}
.selo { font-size: 0.85rem; color: var(--muted); padding-left: 12px; border-left: 3px solid var(--line); }
.selo.texto { border-left-color: var(--verde); } .selo.pessoa { border-left-color: var(--verde); color: var(--verde); }
.selo a { white-space: nowrap; }
/* "Encontrou um erro?": cor própria (roxo), que não se confunde com as cores de situação nem com as das Casas */
.selo a.erro { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 7px 14px; min-height: 36px; border-radius: 14px;
  border: 1.5px solid #6b3fa0; background: #f3eefb; color: #5a2f8f; font-weight: 700; text-decoration: none; white-space: normal; }
.selo a.erro:hover { background: #e7dcf7; }
.selo a.erro:focus-visible { outline: 3px solid #6b3fa0; outline-offset: 2px; }
.mudou.grande { border-left-color: var(--vermelho); }
.mudou { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r); background: var(--amarelo-bg); border-left: 5px solid var(--amarelo-forte); }
.aviso-idioma { margin-top: 18px; padding: 10px 14px; border-radius: var(--r); background: var(--amarelo-bg); font-size: 0.95rem; }
</style>

function baixar(url, aplicar) {
  return PEDIDOS[url] || (PEDIDOS[url] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status + " " + url); return r.json(); })
    .then(d => { aplicar(d); PRONTO.add(url); }).catch(e => { delete PEDIDOS[url]; throw e; }));
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const HOJE = new Date();
const dias = d => d ? Math.floor((HOJE - new Date(d + "T12:00:00")) / 864e5) : Infinity;
const dataBR = d => d ? new Date(d + "T12:00:00").toLocaleDateString(T().locale, { day: "2-digit", month: "short", year: "numeric" }).replace(/\./g, "") : "—";
function haQuanto(d) {
  const n = dias(d), h = T().ha;
  if (!isFinite(n)) return h.sem;
  if (n <= 0) return h.hoje;
  if (n === 1) return h.ontem;
  if (n < 30) return h.dias(n);
  if (n < 365) return h.meses(Math.round(n / 30));
  return h.anos(Math.floor(n / 365));
}

/* ---------- resumo no idioma atual (cai para o português se faltar) ---------- */
const S = p => { const s = p.simples; if (!s) return null; return CUR !== "pt" && s[CUR] ? { ...s, ...s[CUR] } : s; };

/* ---------- situação oficial em linguagem simples ---------- */
const SITUACOES = [/rejeitad/i, /norma jurídica|promulgad/i, /aguardando promulga/i, /aprecia[çc][ãa]o pelo senado|envio ao senado/i, /tramitando em conjunto/i, /arquivad|arquivo/i, /retirad/i,
  /pronta para pauta|pronto para delibera|pronta para a pauta|inclu[íi]da na pauta|ordem do dia/i, /comiss[ãa]o tempor[áa]ria|comiss[ãa]o especial/i, /devolu[çc][ãa]o de relator/i,

const simples = s => { const i = SITUACOES.findIndex(rx => rx.test(s || "")); return i >= 0 ? T().sit[i] : (s || T().sem_info); };
function agora(p) {
  if (p.estado === "rejeitada") return T().sit[0];
  if (p.estado === "aprovada") {
    const v = p.votacoes.filter(x => x.turno === 2 && x.aprovada).pop();
    if (v) return T().agora_aprov(T().naCasa[v.casa], dataBR(v.data), T().aCasa[v.casa === "camara" ? "senado" : "camara"]);
  }
  return simples(p.situacao);
}

/* ---------- fase, cor e textos ---------- */
function casasAprovadas(p) {
  const c = new Set(p.votacoes.filter(v => v.turno === 2 && v.aprovada).map(v => v.casa));
  if (!c.size && p.estado === "aprovada") c.add(p.casaOrigem);
  return c;
}
function fase(p) {
  if (p.estado === "promulgada") return "promulgada";
  if (p.estado === "arquivada" || p.estado === "encerrada" || p.estado === "rejeitada") return "arquivada";
  if (p.estado === "apensada") return "anexada";
  if (casasAprovadas(p).size) return "aprovada";
  if (dias(p.ultimaMovimentacao) > 365) return "parada";
  const et = DB.etapas[p.casaOrigem][p.etapa] || "";
  if (/^Plenário/.test(et) || /pronta para pauta|pronto para delibera/i.test(p.situacao)) return "votacao";
  return "andando";
}
const FASES = ["todas", "votacao", "andando", "aprovada", "promulgada", "parada", "anexada", "arquivada"];
const COR = { votacao: "amarelo", andando: "amarelo", aprovada: "amarelo", promulgada: "verde", parada: "vermelho", anexada: "cinza", arquivada: "vermelho" };
// a etiqueta só fica verde quando a PEC passou nas duas Casas; aprovada em uma só continua amarela (em andamento)
function status(p) {
  if (p.estado === "rejeitada") return ["vermelho", T().rejeitada];
  const f = fase(p);
  if (f !== "aprovada") return [COR[f], T().pill[f]];
  const c = casasAprovadas(p);
  if (c.size > 1) return ["verde", T().ap_duas];
  return ["amarelo", c.has("camara") ? T().ap_cam : T().ap_sen];
}
const pill = p => { const [c, t] = status(p); return `<span class="pill ${c}">${t}</span>`; };

  const et = DB.etapas[p.casaOrigem][p.etapa] || "";
  if (/Câmara/.test(et)) return "camara";

  return p.casa === "ambas" ? p.casaOrigem : p.casa;
};

const votoURL = (p, v) => v.casa === "camara" ? (p.idCamara ? `https://www.camara.leg.br/propostas-legislativas/${p.idCamara}` : p.linkCamara) : (p.codigoMateria ? `https://www25.senado.leg.br/web/atividade/materias/-/materia/${p.codigoMateria}/votacoes` : p.linkSenado);

function dots(p) {
  const n = DB.etapas[p.casaOrigem].length, cur = p.etapa, done = p.estado === "promulgada";
  let h = "";
  for (let i = 0; i < n; i++) h += `<i class="${done || i < cur ? "on" : i === cur ? "now" : ""}"></i>`;
  return `<span class="dots" aria-label="${cur + 1}/${n}: ${esc(nomeEtapa(DB.etapas[p.casaOrigem][cur]))}">${h}</span>`;
}

function cardPEC(p, oculto = false) {
  const f = fase(p), ca = casaAtual(p);

}

const TEXTO_PEC = new Map();
function textoPEC(p) {
  const k = p.id + CUR;
  if (!TEXTO_PEC.has(k)) {
    const s = p.simples || {}, tr = CUR !== "pt" && s[CUR] ? Object.values(s[CUR]).join(" ") : "";

  return TEXTO_PEC.get(k);
}

/* ---------- parlamentares: índice montado a partir das PECs ---------- */
function montarPessoas(pecs) {
  const P = new Map();
  const get = (nome, casa) => {
    const k = casa + "-" + slug(nome);
    if (!P.has(k)) P.set(k, { key: k, nome, casa, partido: "", uf: "", ultimaData: "", autor: new Set(), coautor: new Set(), relator: [], votos: [] });
    return P.get(k);
  };
  for (const p of pecs) {
    for (const [nome, casa, principal] of p.autores || []) (principal ? get(nome, casa).autor : get(nome, casa).coautor).add(p.id);
    for (const [nome, casa, org] of p.relatores || []) { const x = get(nome, casa); if (!x.relator.some(r => r[0] === p.id && r[1] === org)) x.relator.push([p.id, org]); }
    for (const v of p.votacoes) for (const [nome, partido, uf, voto] of v.votos) {
      const x = get(nome, v.casa);
      x.votos.push([p.id, v.turno, v.data, voto]);
      if (v.data >= x.ultimaData) { x.ultimaData = v.data; x.partido = partido; x.uf = uf; }
    }
  }
  for (const x of P.values()) for (const id of x.autor) x.coautor.delete(id);
  const lista = [...P.values()];
  lista.forEach(x => { x.tokens = norm(x.nome).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(t => t.length > 2 && !["dos", "das", "del"].includes(t)); x.peso = x.votos.length + x.autor.size * 5 + x.relator.length * 5 + x.coautor.size; });
  return { lista, porKey: Object.fromEntries(lista.map(x => [x.key, x])) };
}
function acharPessoas(texto) {
  const toks = new Set(norm(texto).replace(/[^a-z0-9 ]/g, " ").split(/\s+/));
  const texto_n = " " + norm(texto).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ") + " ";
  let cheio = PESSOAS.lista.filter(x => x.tokens.length && x.tokens.every(tk => toks.has(tk)) && (x.tokens.length > 1 || texto_n.includes(" " + norm(x.nome).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim() + " ")));
  const maior = Math.max(0, ...cheio.map(x => x.tokens.length));
  cheio = cheio.filter(x => x.tokens.length === maior).sort((a, b) => b.peso - a.peso);
  if (cheio.length) return { certos: cheio, talvez: [] };
  const talvez = PESSOAS.lista.map(x => [x, x.tokens.filter(tk => tk.length > 3 && toks.has(tk)).length]).filter(([, n]) => n > 0)
    .sort((a, b) => b[1] - a[1] || b[0].peso - a[0].peso).slice(0, 8).map(a => a[0]);
  return { certos: [], talvez };
}

const PERIODOS = { mov7: ["mov", 7], mov30: ["mov", 30], apr30: ["apr", 30], apr365: ["apr", 365], vot30: ["vot", 30], vot365: ["vot", 365] };
const dataDe = (p, tipo) => tipo === "apr" ? p.apresentacao : tipo === "vot" ? p.votacoes.reduce((m, v) => v.data > m ? v.data : m, "") || null : p.ultimaMovimentacao;
function filtrar() {
  const q = norm(state.q.trim());
  let l = DB.pecs.filter(p => {
    if (state.tema && TEMA_BY[state.tema] && !TEMA_BY[state.tema][3].test(textoPEC(p))) return false;
    if (state.casa && p.casa !== state.casa && p.casa !== "ambas") return false;
    if (state.fase !== "todas" && fase(p) !== state.fase) return false;
    if (state.periodo) {
      const [tipo, n] = PERIODOS[state.periodo], d = dataDe(p, tipo);
      if (!d || dias(d) > n) return false;
    }
    if (q) {
      const hay = norm(`${p.sigla} ${p.siglaSenado || ""} ${p.siglaCamara || ""} ${p.autor}`) + " " + textoPEC(p);
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  if (state.ordem === "antigas") l = l.slice().sort((a, b) => (a.apresentacao || "").localeCompare(b.apresentacao || ""));
  else if (state.ordem === "novas") l = l.slice().sort((a, b) => (b.apresentacao || "").localeCompare(a.apresentacao || ""));
  else if (state.ordem === "votadas") l = l.slice().sort((a, b) => (dataDe(b, "vot") || "").localeCompare(dataDe(a, "vot") || "") || b.ultimaMovimentacao.localeCompare(a.ultimaMovimentacao));

  return l;
}

let uid = 0, PENDENTE = "";

const raiz = w => w.length > 5 ? w.slice(0, Math.max(5, w.length - 3)) : w;
// palavras do dia a dia que não aparecem nos textos oficiais: cada uma procura só os termos que querem dizer a mesma coisa
// (antes elas puxavam o tema inteiro, e "gasolina" trazia qualquer PEC com "preço")
const CONCEITOS = [
  [["gasolina", "combustivel", "combustiveis", "diesel", "etanol"], /combusti|gasolin|diesel|etanol|derivados de petroleo|\bglp\b|\bcide\b/],
  [["gas de cozinha", "botijao", "botijoes"], /gas de cozinha|botija|\bglp\b|gas liquefeito/],
  [["conta de luz", "energia eletrica", "tarifa de energia"], /energia eletrica|conta de luz|tarifa de energia|tarifa social/],
  [["cesta basica", "comida", "alimentos", "alimentacao"], /cesta basica|aliment|\bfome/],
  [["juros do cartao", "cartao de credito", "juros"], /\bjuros|cartao de credito|credito rotativo/],
  [["remedio", "remedios", "medicamento", "medicamentos"], /medicament|remedio|farmac/],
];
function matchersDe(t, ignorar) {
  // expressões de várias palavras ("meio ambiente", "planos de saude") viram um termo só
  const multi = [...TEMAS.flatMap(x => x[2]), ...CONCEITOS.flatMap(c => c[0])].map(x => x.trim());
  const frases = [...new Set(multi.filter(x => x.includes(" ") && t.includes(" " + x + " ")))];
  const usadas = new Set(frases.flatMap(f => f.split(" ")));
  const palavras = [...new Set(t.trim().split(" ").filter(w => w.length >= 3 && !PARADAS.has(w) && !ignorar.has(w) && !usadas.has(w)))];
  const matchers = [
    ...frases.map(f => ({ rotulo: f, direto: new RegExp("\\b" + f.split(" ").map(raiz).join("\\w*\\s+(?:\\w+\\s+)?")), sin: [] })),
    ...palavras.map(w => ({ rotulo: w, direto: new RegExp("\\b" + raiz(w)), sin: [] })),
  ];
  // sinônimos precisos primeiro; um termo com sinônimo preciso não ganha o tema inteiro
  for (const [termos, rx] of CONCEITOS) for (const m of matchers) if (termos.includes(m.rotulo)) { m.sin = [rx]; m.preciso = true; }
  // sinônimos de tema: "praia" também procura "terrenos de marinha", "lgbt" procura "orientação sexual" etc.
  for (const [, , sins, rx] of TEMAS) {
    for (const s of sins.filter(x => t.includes(" " + x.trim()) && !(usadas.has(x.trim()) && !frases.includes(x.trim())))) {
      const alvo = matchers.find(m => m.rotulo === s.trim() || s.trim().split(" ").includes(m.rotulo) || m.rotulo.startsWith(s.trim()));
      if (alvo) { if (!alvo.preciso && !alvo.sin.includes(rx)) alvo.sin.push(rx); }
      else matchers.push({ rotulo: s.trim(), direto: null, sin: [rx] });
    }
  }

function buscarPECs(texto, ignorar = new Set()) {
  const limpo = s => " " + s.replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ") + " ";
  const t = limpo(norm(texto)), N = DB.pecs.length;
  // cada parte separada por vírgula, "e" ou "ou" é um interesse diferente ("saúde e educação");
  // dentro de uma parte, as palavras descrevem uma coisa só ("preço da gasolina")
  // entre aspas ("amazonia"): só aquela palavra ou expressão, sem sinônimos nem tema
  const exatos = [];
  const semAspas = norm(texto).replace(/["“”]([^"“”]+)["“”]/g, (_, x) => { const e = limpo(x).trim(); if (e) exatos.push(e); return " , "; });
  const partes = [
    ...semAspas.split(/[,;\/]| e | ou | tambem /).map(limpo).filter(x => x.trim()).map(parte => matchersDe(parte, ignorar)),
    ...exatos.map(e => [{ rotulo: `"${e}"`, direto: new RegExp("\\b" + e.split(" ").join("\\s+") + "(s|es)?\\b"), sin: [] }]),   // aceita o plural
  ];
  const pont = new Map(), achou = [], semResultado = [], parcial = [];
  for (const matchersDaParte of partes) {
    const ms = matchersDaParte.filter(m => !achou.includes(m.rotulo));
    const comAchado = [];
    for (const m of ms) {
      m.hits = new Map();
      for (const p of DB.pecs) {
        const tx = textoPEC(p);
        if (m.direto && m.direto.test(tx)) m.hits.set(p.id, 1);
        else if (m.sin.some(rx => rx.test(tx))) m.hits.set(p.id, 0);
      }
      if (m.hits.size) { comAchado.push(m); achou.push(m.rotulo); } else semResultado.push(m.rotulo);
    }
    if (!comAchado.length) continue;
    // o termo mais raro é o mais específico: "gasolina" diz mais do que "preço"
    const maisRaro = comAchado.reduce((a, b) => b.hits.size < a.hits.size ? b : a);
    const local = new Map();
    for (const m of comAchado) for (const [id, dir] of m.hits) {
      const a = local.get(id) || { k: 0, d: 0 };
      a.k++; a.d += dir; local.set(id, a);
    }
    let completas = 0;
    for (const [id, a] of local) {
      const todas = a.k === comAchado.length;
      // só entra quem fala de tudo o que a pessoa escreveu ou, pelo menos, do termo mais específico
      if (!todas && !maisRaro.hits.has(id)) continue;
      if (todas) completas++;
      const g = pont.get(id) || { k: 0, d: 0, c: 0 };
      g.c += todas && comAchado.length > 1 ? 1 : 0; g.k += a.k; g.d += a.d;
      pont.set(id, g);
    }
    if (comAchado.length > 1 && !completas) parcial.push([comAchado.map(m => m.rotulo), maisRaro.rotulo]);
  }
  // quem digitou o apelido ("reforma tributaria", "pec das praias") vê essa PEC primeiro
  for (const p of DB.pecs) {
    const ap = p.simples?.apelido && norm(p.simples.apelido).replace(/[^a-z0-9 ]/g, " ").replace(/\bpec (d[aoe]s?|antidrogas)?\s*/, "").trim();
    if (ap && ap.length > 4 && t.includes(" " + ap)) { const a = pont.get(p.id) || { k: 0, d: 0, c: 0 }; a.ap = 1; pont.set(p.id, a); }
  }
  let lista = DB.pecs.filter(p => pont.has(p.id));
  const todas = new Set(lista.map(p => p.id));
  const vivas = lista.filter(p => !["anexada", "arquivada"].includes(fase(p)));
  if (vivas.length) lista = vivas;
  // ordem: apelido digitado > fala de tudo o que foi escrito > casa com mais palavras > tem a palavra exata > mais perto de uma decisão > mais recente
  const g = id => pont.get(id);
  lista.sort((x, y) => (g(y.id).ap || 0) - (g(x.id).ap || 0) || g(y.id).c - g(x.id).c || g(y.id).k - g(x.id).k || g(y.id).d - g(x.id).d || PRIOR[fase(x)] - PRIOR[fase(y)] || y.ultimaMovimentacao.localeCompare(x.ultimaMovimentacao));
  return { achou, semResultado, parcial, lista, todas, lgbt: /lgbt|gay|lesbica|trans |orientacao sexual|homoafetiv/.test(t) };
}

function renderDescubra(inicial = {}) {
  const aviso = I18N[LANG].so_pt;
  emPT(() => {
    const L = T();
    app.innerHTML = `
    ${aviso ? `<p class="aviso-idioma" lang="${I18N[LANG].htmlLang}">${aviso}</p>` : ""}
    <div class="hero">
      <h1>${L.d_h1}</h1>
      <p>${L.d_p}</p>
    </div>
    <div class="chat" id="chat"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-in" type="text" aria-label="${L.d_msg}" placeholder="${L.d_ph}" autocomplete="off">
      <button class="btn" type="submit">${L.d_env}</button>
    </form>
    ${rodape()}`;
    bot(`<p><b>${L.d_oi}</b></p><p>${L.d_ex}</p>`);
  });
  app.querySelector("#chat-form").addEventListener("submit", e => {
    e.preventDefault();
    const inp = app.querySelector("#chat-in"), t = inp.value.trim();
    if (!t) return;
    inp.value = "";
    emPT(() => responder(t));
  });
  app.querySelector("#chat").addEventListener("click", e => {
    const b = e.target.closest("[data-toggle],[data-mais]");
    if (!b) return;
    if (b.dataset.toggle) { const el = document.getElementById(b.dataset.toggle); el.hidden = !el.hidden; b.setAttribute("aria-expanded", String(!el.hidden)); }
    else if (b.dataset.mais) { document.getElementById(b.dataset.mais).querySelectorAll("[hidden]").forEach(x => x.hidden = false); b.remove(); }
  });
  const q = PENDENTE || (inicial.tema && TEMA_BY[inicial.tema] ? TEMA_BY[inicial.tema][1] : "");
  PENDENTE = "";
  emPT(() => {
    if (q) responder(q);
    if (inicial.pessoa) {
      const x = PESSOAS.porKey[inicial.pessoa];
      if (x) responder(x.nome, { pessoas: [x] });
      else bot(`<p>${T().d_parl_nao}</p>`);
    }
  });
  app.querySelector("#chat-in").focus({ preventScroll: true });
}
const chatEl = () => app.querySelector("#chat");
function bot(html) { const d = document.createElement("div"); d.className = "msg bot"; d.innerHTML = html; chatEl().appendChild(d); return d; }
function eu(texto) { const d = document.createElement("div"); d.className = "msg user"; d.textContent = texto; chatEl().appendChild(d); return d; }
function listaPECs(pecs, max = 5) {
  const id = "l" + (++uid);
  return `<div class="list" id="${id}">${pecs.map((p, i) => cardPEC(p, i >= max)).join("")}</div>
    ${pecs.length > max ? `<button type="button" class="more" data-mais="${id}">${T().mostrar_todas(pecs.length)}</button>` : ""}`;
}
const juntar = arr => arr.length > 1 ? arr.slice(0, -1).join(", ") + ` ${T().e} ` + arr[arr.length - 1] : arr[0] || "";
function responder(texto, forcado) {
  const L = T(), minha = eu(texto);
  let pessoas = forcado?.pessoas || [], talvez = [];
  if (!forcado) { const r = acharPessoas(texto); pessoas = r.certos.slice(0, 3); talvez = r.talvez; }
  const r = forcado ? null : buscarPECs(texto, new Set(pessoas.flatMap(x => x.tokens)));
  // "Fulano saúde": a pergunta é sobre a pessoa naquele tema, não sobre o tema inteiro
  const comTema = pessoas.length && r && r.achou.length;
  for (const x of pessoas) respostaPessoa(x, comTema ? { ids: r.todas, rotulo: juntar(r.achou.map(w => `<b>${esc(w)}</b>`)) } : null);
  if (!forcado && !comTema) {
    if (r.lista.length) {
      const prontas = r.lista.filter(p => fase(p) === "votacao").length;
      bot(`<p>${L.d_achei(juntar(r.achou.map(w => `<b>${esc(w)}</b>`)), r.lista.length, prontas)}</p>
        ${listaPECs(r.lista)}
        ${r.parcial.map(([tudo, um]) => `<p class="small muted">${L.d_parcial(juntar(tudo.map(esc)), esc(um))}</p>`).join("")}
        ${r.semResultado.length ? `<p class="small muted">${L.d_sem(juntar(r.semResultado.map(esc)))}</p>` : ""}
        ${r.lgbt ? `<p class="small muted">${L.d_lgbt}</p>` : ""}`);
    } else if (!pessoas.length) {
      const sug = talvez.length ? `<p>${L.d_talvez(talvez.slice(0, 5).map(x => `<a href="#parlamentar-${x.key}">${esc(x.nome)} (${L.casa[x.casa]})</a>`).join(", "))}</p>` : "";
      bot(`<p>${/["“”]/.test(texto) ? L.d_nada_exato : L.d_nada}</p>${sug}`);
    }
  }
  minha.scrollIntoView({ behavior: "smooth", block: "start" });
}
function respostaPessoa(x, filtro) {
  const L = T(), id = "p" + (++uid);
  const linkPec = pid => { const p = BY_ID[pid]; return p ? `<a href="#pec-${p.id}">${esc(p.sigla)}${S(p)?.apelido ? ` · ${esc(S(p).apelido)}` : ""}: ${esc(titulo(p))}</a>` : ""; };
  // com tema ("Fulano saúde"), só entram as PECs daquele tema
  const ok = pid => !filtro || filtro.ids.has(ALIAS[pid] || pid);
  const autor = [...x.autor].filter(ok), coautor = [...x.coautor].filter(ok), relator = x.relator.filter(r => ok(r[0])), votos = x.votos.filter(v => ok(v[0]));
  const sim = votos.filter(v => v[3] === "sim").length, nao = votos.filter(v => v[3] === "nao").length;
  const stat = (key, n, rotulo, itens) => `<button type="button" class="stat" ${n ? `data-toggle="${id}-${key}" aria-expanded="false"` : "disabled"}><span>${rotulo}</span><b class="num">${n}</b></button>
    ${n ? `<div class="stat-detail" id="${id}-${key}" hidden>${itens}</div>` : ""}`;
  const votosOrd = votos.slice().sort((a, b) => b[2].localeCompare(a[2]));
  const cab = `<p><b>${esc(x.nome)}</b> · ${L.cargo[x.casa]}${x.partido ? ` · ${esc(x.partido)}${x.uf ? "-" + esc(x.uf) : ""}` : ""}</p>`;
  if (filtro && !autor.length && !coautor.length && !relator.length && !votos.length) {
    bot(`${cab}<p>${L.p_tema_nada(filtro.rotulo)}</p>`);
    return;
  }
  bot(`${cab}${filtro ? `<p>${L.p_tema(filtro.rotulo)}</p>` : ""}
    <div class="stat-list">
      ${stat("autor", autor.length, L.p_propos, autor.map(linkPec).join(""))}
      ${stat("coautor", coautor.length, L.p_coautor, coautor.map(linkPec).join(""))}
      ${stat("relator", new Set(relator.map(r => r[0])).size, L.p_relator, relator.map(([pid, org]) => `<span>${linkPec(pid)}${org ? ` <span class="muted small">(${esc(org)})</span>` : ""}</span>`).join(""))}
      ${stat("votos", votos.length, L.p_votos(sim, nao, votos.length - sim - nao), votosOrd.map(([pid, turno, data, voto]) => `<span>${dataBR(data)} · ${L.turno(turno)} · <b class="${VOTO_CLS[voto]}">${L.votos[voto]}</b> · ${linkPec(pid)}</span>`).join(""))}
    </div>
    <p class="small muted">${L.p_nota}</p>`);
}

/* ---------- rotas ---------- */
let ultimaRota = "";
function rota() {
  if (!DB) return;
  CUR = LANG;
  const h = location.hash.replace(/^#/, "");
  // o que esta página precisa baixar antes de aparecer
  const falta = [];
  const descubra = h.startsWith("descubra") || h.startsWith("parlamentar-");
  if (LANG !== "pt" && !PRONTO.has(urlIdioma(LANG))) falta.push(() => baixarIdioma(LANG));
  if (h.startsWith("pec-")) { const id = ALIAS[h.slice(4)] || h.slice(4); if (BY_ID[id] && !PRONTO.has(urlDetalhe(id))) falta.push(() => baixarDetalhe(id)); }
  if (descubra && !PRONTO.has(URL_PESSOAS)) falta.push(baixarPessoas);
  if (falta.length) {
    app.innerHTML = `<div class="hero"><h1>${T().carregando}</h1></div>`;
    Promise.all(falta.map(f => f())).then(() => { if (location.hash.replace(/^#/, "") === h) rota(); })
      .catch(err => { console.error(err); app.innerHTML = `<div class="hero"><h1>${T().erro_h}</h1><p>${T().erro_p}</p></div>`; });
    return;
  }
  const sec = h.startsWith("pec-") ? "inicio" : (h.startsWith("descubra") || h.startsWith("parlamentar-")) ? "descubra" : (h || "inicio");
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === sec ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (h.startsWith("pec-")) renderPEC(h.slice(4));
  else if (h === "como-funciona") renderComo();
  else if (h.startsWith("descubra")) renderDescubra({ tema: h.slice("descubra-".length) });
  else if (h.startsWith("parlamentar-")) renderDescubra({ pessoa: h.slice("parlamentar-".length) });
  else renderInicio();
  if (h !== ultimaRota) window.scrollTo(0, 0);   // trocar de idioma mantém a posição na página
  ultimaRota = h;
}
window.addEventListener("hashchange", rota);

// PWA: guarda o site no aparelho para abrir rápido e funcionar sem internet (ver sw.js)

}).catch(err => {
  console.error(err);
  app.innerHTML = `<div class="hero"><h1>${T().erro_h}</h1><p>${T().erro_p}</p></div>`;
});
